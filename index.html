<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Pendaftaran Kelas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <h2>Pendaftaran Kelas</h2>

        <input id="nama" placeholder="Nama">
        <input id="umur" type="number" placeholder="Umur">

        <select id="kelas">
            <option>JavaScript Dasar</option>
            <option>Web Design</option>
            <option>Backend Dasar</option>
        </select>

        <label class="checkbox">
            <input type="checkbox" id="komitmen">
            Saya siap mengikuti kelas
        </label>

        <button id="daftar">Daftar Kelas</button>

        <div id="hasil"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
